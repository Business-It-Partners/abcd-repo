<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-QxKPypccfuyhMR46nwtOP1sxgoNKNWXp+27ulGg8W+g='; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Dental OS app frame</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body { color: #292a30; font: 15px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      main { min-height: 100vh; padding: clamp(22px, 4vw, 42px); }
      .eyebrow { margin: 0 0 12px; color: #666d76; font-size: 11px; font-weight: 650; letter-spacing: .12em; }
      h1 { margin: 0; color: #202a38; font-size: clamp(24px, 3vw, 32px); font-weight: 650; letter-spacing: -.035em; line-height: 1.2; }
      .description { max-width: 560px; margin: 10px 0 24px; color: #666d76; }
      .status { display: flex; max-width: 460px; align-items: flex-start; gap: 12px; padding: 14px 16px; border: 1px solid #d5d9e3; border-radius: 9px; background: #f8f9fb; }
      .status-dot { width: 8px; height: 8px; flex: 0 0 8px; margin-top: 5px; border-radius: 50%; background: #7b8798; }
      .status strong, .status small { display: block; }
      .status strong { color: #202a38; font-size: 12px; }
      .status small { margin-top: 2px; color: #626b78; font-size: 12px; }
    </style>
    <script defer src="/apps/runtime.v1.js" integrity="sha256-QxKPypccfuyhMR46nwtOP1sxgoNKNWXp+27ulGg8W+g=" crossorigin="anonymous"></script>
  </head>
  <body>
    <main id="app-root" aria-live="polite">
      <p class="eyebrow">ISOLATED APP PREVIEW</p>
      <h1>Starting app…</h1>
      <p class="description">Verifying the trusted app session.</p>
    </main>
  </body>
</html>

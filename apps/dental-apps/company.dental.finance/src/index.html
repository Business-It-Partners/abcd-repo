<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; img-src 'self'; script-src 'self'; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Transaction Record</title>
    <link rel="stylesheet" href="./app.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <header class="app-toolbar" aria-label="Finance app toolbar">
        <div class="app-toolbar-start">
          <span id="active-module" aria-live="polite">Transaction Record</span>
          <button id="more-apps" type="button" aria-label="More Finance apps" class="more-apps">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <rect x="1" y="1" width="5" height="5" rx="1" />
              <rect x="10" y="1" width="5" height="5" rx="1" />
              <rect x="1" y="10" width="5" height="5" rx="1" />
              <rect x="10" y="10" width="5" height="5" rx="1" />
            </svg>
            <span>More Apps</span>
          </button>
        </div>
        <p class="preview-indicator" role="status">Staging preview · v1.0.1</p>
      </header>
      <section class="app-content">
        <h1 id="app-title" tabindex="-1">Transaction Record</h1>
      </section>
    </main>
  </body>
</html>

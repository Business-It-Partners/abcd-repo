<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; font-src 'none'; script-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
    <title>Lab Tracker</title>
    <link rel="stylesheet" href="./app.css">
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <header class="app-toolbar" aria-label="Lab Tracker app toolbar">
        <div class="app-toolbar-start">
          <span id="active-module" aria-live="polite">Lab Tracker</span>
          <button class="more-apps" id="more-apps" type="button" aria-label="More Lab Tracker apps">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <rect x="1" y="1" width="5" height="5" rx="1" />
              <rect x="10" y="1" width="5" height="5" rx="1" />
              <rect x="1" y="10" width="5" height="5" rx="1" />
              <rect x="10" y="10" width="5" height="5" rx="1" />
            </svg>
            <span>More Apps</span>
          </button>
        </div>
        <p class="preview-indicator" role="status">Staging preview · v1.0.1</p>
      </header>
      <section class="app-content">
        <h1 id="app-title">Lab Tracker</h1>
      </section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>

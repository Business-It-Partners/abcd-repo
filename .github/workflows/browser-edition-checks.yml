name: Browser Edition checks

on:
  push:
    branches: [browser-version]
  pull_request:
    branches: [browser-version]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    name: Browser Edition source tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Browser Edition tests
        run: npm test

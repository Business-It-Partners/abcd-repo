name: Windows milestone validation
on:
  push:
    branches: [main, 'codex/milestone-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate documentation
        run: python tools/check-dental-docs.py
      - name: Unit and filesystem state checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          node node_modules/vitest/vitest.mjs run --exclude 'apps/dental-apps/**' --maxWorkers=1 --reporter=default --reporter=json --outputFile=artifacts/windows-unit.json *> artifacts/windows-unit.log
          $code = $LASTEXITCODE
          Get-Content artifacts/windows-unit.log
          exit $code
      - name: Build and typecheck
        shell: pwsh
        run: |
          npm run build *> artifacts/windows-build.log
          $code = $LASTEXITCODE
          Get-Content artifacts/windows-build.log
          exit $code
      - name: First-party app shell package checks
        shell: pwsh
        run: |
          $packages = Get-ChildItem apps/dental-apps -Directory | Sort-Object Name
          if (-not $packages) { throw 'No first-party app package directories were found.' }
          foreach ($package in $packages) {
            if (-not (Test-Path -LiteralPath (Join-Path $package.FullName 'package.json'))) { continue }
            Write-Host "Testing first-party shell package $($package.Name)"
            npm --prefix $package.FullName test
            $code = $LASTEXITCODE
            if ($code -ne 0) { exit $code }
          }
      - name: Windows isolated runtime proof
        run: node tests/runtime-ci.mjs
      - name: Windows hardening proof
        run: node tests/hardening-ci.mjs
      - name: Windows preserved-state recovery
        run: node tests/recovery-ci.mjs
      - name: Windows bounded runtime resource profile
        run: node tests/resources-ci.mjs
      - name: Windows maximum app-count resource profile
        run: node tests/resources-limit-ci.mjs
      - name: Windows integrated OS and API contract proof
        run: node tests/integration-ci.mjs
      - name: Windows app update process-exit recovery
        run: node tests/updates-crash.mjs
      - name: Windows safe app update proof
        run: node tests/updates-ci.mjs
      - name: Windows Store and distribution proof
        run: node tests/distribution-ci.mjs
      - name: Windows package process-exit recovery
        run: node tests/packages-crash.mjs
      - name: Windows verified package runtime
        run: node tests/packages-ci.mjs
      - name: Windows hosted-runner startup and recovery
        run: node tests/windows-host-ci.mjs
      - name: Windows SDK and broker proof
        run: node tests/sdk-ci.mjs
      - name: Windows identity and session proof
        run: node tests/identity-ci.mjs
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-milestone-${{ github.sha }}
          path: |
            artifacts/win32-updates-crash.json
            artifacts/windows-updates.json
            artifacts/updates-store.png
            artifacts/windows-recovery.json
            artifacts/windows-hardening.json
            artifacts/windows-resources.json
            artifacts/windows-resources-limit.json
            artifacts/windows-integration.json
            artifacts/windows-unit.log
            artifacts/windows-build.log
            artifacts/windows-unit.json
            artifacts/windows-distribution.json
            artifacts/distribution-store.png
            artifacts/win32-packages-crash.json
            artifacts/windows-packages.json
            artifacts/windows-host-ci.json
            artifacts/windows-runtime.json
            artifacts/windows-sdk.json
            artifacts/windows-identity.json
            artifacts/identity-gate.png
            artifacts/sdk-fixtures.png
            artifacts/runtime-overlap.png
            artifacts/runtime-crash.png
          retention-days: 30

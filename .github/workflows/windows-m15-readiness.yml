name: M15 cross-platform readiness validation
on:
  push:
    branches: ['codex/m15-readiness']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-m15-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-m15:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Windows build toolchain
        run: npm run check:toolchain
      - name: Validate documentation
        run: python tools/check-dental-docs.py
      - name: Build test fixtures
        run: npm run pretest
      - name: Unit and filesystem state checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          node node_modules/vitest/vitest.mjs run --exclude 'apps/dental-apps/**' --maxWorkers=1 --reporter=default --reporter=json --outputFile=artifacts/windows-unit.json *> artifacts/windows-unit.log
          $code = $LASTEXITCODE
          Get-Content artifacts/windows-unit.log
          exit $code
      - name: Build and typecheck
        shell: pwsh
        run: |
          npm run build *> artifacts/windows-build.log
          $code = $LASTEXITCODE
          Get-Content artifacts/windows-build.log
          exit $code
      - name: Windows protected credential storage (real Electron safeStorage)
        run: npm run test:windows-safe-storage
      # Run fragile focused shell identity/keyboard checks early so failures
      # do not consume resource-pressure and integration CI minutes.
      - name: Windows saved identity and session recovery
        run: node tests/identity-ci.mjs
      - name: Windows shell and app failure containment
        run: |
          node tests/runtime-ci.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/hardening-ci.mjs
      - name: Windows saved-state recovery
        run: node tests/recovery-ci.mjs
      - name: Windows resource-pressure recovery
        run: |
          node tests/resources-ci.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/resources-limit-ci.mjs
      - name: Windows integrated shell and API contract
        run: node tests/integration-ci.mjs
      - name: Retain M15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-m15-readiness-${{ github.sha }}
          path: |
            artifacts/windows-unit.log
            artifacts/windows-unit.json
            artifacts/windows-build.log
            artifacts/windows-runtime.json
            artifacts/windows-hardening.json
            artifacts/windows-recovery.json
            artifacts/windows-resources.json
            artifacts/windows-resources-limit.json
            artifacts/windows-integration.json
            artifacts/windows-identity.json
            artifacts/runtime-overlap.png
            artifacts/runtime-crash.png
            artifacts/identity-gate.png
          if-no-files-found: warn
          retention-days: 30

  linux-m15:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate documentation
        run: python3 tools/check-dental-docs.py
      - name: Build test fixtures
        run: npm run pretest
      - name: Run Linux unit and integration checks
        run: npm test -- --maxWorkers=1 --no-file-parallelism
      - name: Typecheck and build Linux source
        run: npm run build

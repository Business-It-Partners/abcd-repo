<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; pointer-events: none; }
      #caption {
        position: fixed; display: grid; place-items: center; overflow: hidden;
        white-space: nowrap; border: 1px solid #6e81a526; border-radius: 8px;
        background: #fffffff2; box-shadow: 0 5px 16px #52658a26;
        padding: 6px clamp(7px, .8vw, 11px); color: #292a30;
        font-size: clamp(10px, .95vw, 13px); font-weight: 600; line-height: 1.2;
      }
      #caption[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="caption" hidden></div>
    <script>
      const caption = document.getElementById('caption');
      window.dockCaptionOverlay.subscribe(value => {
        if (!value) { caption.hidden = true; return; }
        caption.textContent = value.label;
        caption.style.left = `${value.rect.x}px`;
        caption.style.top = `${value.rect.y}px`;
        caption.style.width = `${value.rect.width}px`;
        caption.style.height = `${value.rect.height}px`;
        caption.hidden = false;
      });
    </script>
  </body>
</html>
